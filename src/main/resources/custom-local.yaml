# アプリ独自設定(ローカル環境)。
# SpringBoot自体の設定は「application-local.yml」側で持つ。
taskall:

  # DBメンテナンス機能(DB構成取得/DB構成更新)関連の設定
  dbmng:

    # DB構成取得で生成するTSV/SQLファイルの配置先ディレクトリ
    # (「src/main/resources/db/data」「db/sql」は初期シード専用のため、実行時の
    # 読み書きにはjar内クラスパスではなく、この作業ディレクトリを使用する)
    work-dir: ./dbmng-work

  # デフォルトアカウントパスワードのSSM Parameter Store経由差し替え(issue #41)関連の設定。
  # ローカル環境ではAWS認証情報が無くても起動できるよう、明示的に無効化しておく
  # (デフォルト値もfalseだが、意図を明確にするため明示的に記載する)。
  credential-init:
    enabled: false

  # 二段階認証パスコード等、アプリが送信するメールの送信元アドレス(issue #66)。
  # ローカル環境ではMailHog等のダミーSMTPサーバへ送信するだけのため、実在性は問われない。
  mail:
    from-address: no-reply@taskall-v2.com

  # reCAPTCHA(不正なメール送信要求の連続実行防止、issue #80)関連の設定。
  # ローカル環境ではGoogle公式の「常に成功するテストキー」を使用する
  recaptcha:
    site-key: 6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI
    secret-key: 6LeIxAcTAAAAAGG-vFI1TnRWxMZNFuojJ4WifJWe

  # 監視対象メールアドレス(issue #96)の接続確認先(平文認証の自社メールサーバ)。
  # ローカル環境ではMailHog等のダミーIMAPサーバは用意していないため、実在のメールサーバは
  # 別途各自の開発環境に合わせて設定すること。
  mail-addr-verification:
    plain-host: localhost
    plain-port: 143

  # 監視対象メールアドレスのパスワード暗号化(issue #96)。
  # ローカル環境ではAWS認証情報が無くても起動できるよう、明示的にKMSを無効化しておく
  # (デフォルト値もfalseだが、意図を明確にするため明示的に記載する)。
  mail-addr-encryption:
    enabled: false
