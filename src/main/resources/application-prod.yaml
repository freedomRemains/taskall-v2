# 本番環境向けのSpringBoot設定。
# アプリ独自設定(DBメンテナンスのTSV/SQL配置先など)は「custom-prod.yml」側で持つ。
#
# 本番も当面はSQLiteを使用する(documents/design/2000001_base_design.md参照)。
# 将来的にMySQLへ移行する際は、本ファイルのdatasource設定のみを差し替える想定。
server:
  # CloudFront経由でX-Forwarded-Host/-Protoヘッダーを付与している(issue #59)ため、
  # HttpServletRequest#getRequestURL()等が組み立てる絶対URL(ログイン失敗時の
  # sendRedirect等)がオリジン(EC2)側のドメイン名ではなく、利用者が実際にアクセスした
  # ドメイン名(https)を基準にするよう、SpringBoot自体にヘッダー解釈を有効化する。
  forward-headers-strategy: framework

spring:

  # アプリ独自設定のインポート
  config:
    import: custom-prod.yaml

  # DB接続設定
  datasource:
    url: ${TASKALL_DATASOURCE_URL:jdbc:sqlite:./taskallv2.db}
    driver-class-name: org.sqlite.JDBC
    username:
    password:

  # メール送信設定(本番はSMTPサーバの接続情報を環境変数で注入する)
  mail:
    host: ${TASKALL_MAIL_HOST}
    port: ${TASKALL_MAIL_PORT:587}
    username: ${TASKALL_MAIL_USERNAME}
    password: ${TASKALL_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
