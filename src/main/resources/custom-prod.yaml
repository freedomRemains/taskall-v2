# アプリ独自設定(本番環境)。
# SpringBoot自体の設定は「application-prod.yml」側で持つ。
taskall:

  # DBメンテナンス機能(DB構成取得/DB構成更新)関連の設定
  dbmng:

    # DB構成取得で生成するTSV/SQLファイルの配置先ディレクトリ。
    # 本番環境ではCI/CDにより実行可能jarが/opt/taskall-v2配下へ配置されるため、そのパス以下を
    # デフォルトとし、環境変数での上書きも可能にする。存在しない場合は各サービスの
    # Files.createDirectories呼び出しで自動作成される。
    work-dir: ${TASKALL_DBMNG_WORK_DIR:/opt/taskall-v2/dbmng}

  # デフォルトアカウントパスワードのSSM Parameter Store経由差し替え(issue #41)関連の設定。
  # 本番のEC2デプロイでは、init.sh.tftpl(infra/terraform/modules/ec2)が/etc/taskall-v2/config.env
  # 経由でTASKALL_CREDENTIAL_INIT_ENABLED=trueを明示的に設定する。SpringBootTestが本プロファイルを
  # 使う既存テスト等、環境変数を設定していない実行では既定でfalse(無効)のままとし、
  # AWS認証情報が無い環境でもコンテキスト起動に支障が出ないようにする。
  credential-init:
    enabled: ${TASKALL_CREDENTIAL_INIT_ENABLED:false}
    parameter-prefix: ${TASKALL_CREDENTIAL_INIT_PARAMETER_PREFIX:/taskallv2/accnt}

  # 二段階認証パスコード等、アプリが送信するメールの送信元アドレス(issue #66)。
  # SESはドメイン単位で検証済みのため、実在するメールボックスを別途作成する必要はない
  # (未設定の場合の既定値もno-reply@taskall-v2.comだが、意図を明確にするため明示的に記載する)。
  mail:
    from-address: ${TASKALL_MAIL_FROM_ADDRESS:no-reply@taskall-v2.com}

  # reCAPTCHA(不正なメール送信要求の連続実行防止、issue #80)関連の設定。
  # 本番環境ではrender-secrets-env.shがSSM Parameter Storeから取得しTASKALL_RECAPTCHA_SITE_KEY/
  # TASKALL_RECAPTCHA_SECRET_KEY環境変数として設定する
  recaptcha:
    site-key: ${TASKALL_RECAPTCHA_SITE_KEY:}
    secret-key: ${TASKALL_RECAPTCHA_SECRET_KEY:}

  # 監視対象メールアドレス(issue #96)の接続確認先(平文認証の自社メールサーバ)。
  # 本番では自社メールサーバのホスト・ポートを環境変数で注入する。
  mail-addr-verification:
    plain-host: ${TASKALL_MAIL_ADDR_PLAIN_HOST:}
    plain-port: ${TASKALL_MAIL_ADDR_PLAIN_PORT:143}

  # 監視対象メールアドレスのパスワード暗号化(issue #96、AWS KMSによるエンベロープ暗号化)。
  # 本番のEC2デプロイでは、init.sh.tftpl(infra/terraform/modules/ec2)が/etc/taskall-v2/config.env
  # 経由でTASKALL_MAIL_ADDR_ENCRYPTION_ENABLED=trueおよびKMSキーIDを明示的に設定する。
  mail-addr-encryption:
    enabled: ${TASKALL_MAIL_ADDR_ENCRYPTION_ENABLED:false}
    kms-key-id: ${TASKALL_MAIL_ADDR_ENCRYPTION_KMS_KEY_ID:}
