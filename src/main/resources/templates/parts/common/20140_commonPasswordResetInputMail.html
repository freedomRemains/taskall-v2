<!--/* パスワード再設定の受付画面。メールアドレスと新しいパスワードを中央寄せのcardで入力させる。 */-->
<div xmlns:th="http://www.thymeleaf.org" th:fragment="body" class="1001301 row justify-content-center my-5">
    <div class="col-12 col-md-6 col-lg-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h5 card-title text-center mb-4">パスワード再設定</h1>
                <p class="text-center mb-4">登録メールアドレスと、新しく設定したいパスワードを入力してください。</p>
                <div class="mb-3">
                    <label for="MAIL_ADDRESS" class="form-label">メールアドレス</label>
                    <input id="MAIL_ADDRESS" name="MAIL_ADDRESS" class="form-control" autocomplete="email">
                </div>
                <div class="mb-3">
                    <label for="AFTER_PASSWORD" class="form-label">新しいパスワード</label>
                    <input id="AFTER_PASSWORD" type="password" name="AFTER_PASSWORD" class="form-control"
                           autocomplete="new-password">
                </div>
                <div class="mb-4">
                    <label for="AFTER_PASSWORD_CONFIRM" class="form-label">新しいパスワード（確認用）</label>
                    <input id="AFTER_PASSWORD_CONFIRM" type="password" name="AFTER_PASSWORD_CONFIRM"
                           class="form-control" autocomplete="new-password">
                </div>
                <div class="d-grid">
                    <button type="button" class="btn btn-primary" onclick="submitMainForm()">送信する</button>
                </div>
            </div>
        </div>
    </div>
</div>
