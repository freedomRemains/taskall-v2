<!--/* DBメンテナンスの対象テーブル一覧。以前は素のtable要素で左寄せ表示していたが、
       Bootstrapの標準table装飾を適用しつつ、table-responsiveでラップした上でw-autoにより
       テーブル自体をmx-auto(d-flex justify-content-center)で中央寄せする */-->
<div xmlns:th="http://www.thymeleaf.org" th:fragment="body" class="1000401">
    <div class="p-2 d-flex justify-content-center">
        <div class="table-responsive">
            <table class="table table-bordered table-striped table-hover align-middle w-auto">
                <thead class="table-primary">
                    <tr>
                        <th class="px-2 py-1">テーブル</th>
                        <th class="px-2 py-1">定義参照</th>
                        <th class="px-2 py-1">データ編集</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="table : ${T(com.freedom.taskall_v2.web.util.HtmlPageItemUtil).findRecords(htmlPage, 'tableList')}">
                        <td class="px-2 py-1 align-middle"
                            th:text="${table.TABLE_LOGICAL_NAME + '(' + table.TABLE_NAME + ')'}">table</td>
                        <td class="px-2 py-1">
                            <a class="btn btn-outline-primary btn-sm"
                               th:href="${table.TABLE_DEF_REF_URL}"
                               target="_blank" rel="noopener noreferrer">定義参照</a>
                        </td>
                        <td class="px-2 py-1">
                            <a class="btn btn-primary btn-sm"
                               th:href="${table.TABLE_DATA_MAINTE_URL}">データ編集</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
