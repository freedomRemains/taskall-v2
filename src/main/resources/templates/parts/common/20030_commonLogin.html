<!--/* ゲストのマイページ表示時のログイン画面。共通ヘッダとの間に余白(my-5)を空け、
       入力欄・サインインボタンを画面中央(col-md-4 mx-auto)に寄せる構成へ変更する */-->
<div xmlns:th="http://www.thymeleaf.org" th:fragment="body" th:if="${account.get(0).ACCNT_ID == '1000001'}" class="1000201 row justify-content-center my-5">
    <div class="col-12 col-md-5 col-lg-4">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h5 card-title text-center mb-4">ログイン</h1>
                <div class="mb-3">
                    <label for="MAIL_ADDRESS" class="form-label">メールアドレス</label>
                    <input id="MAIL_ADDRESS" name="MAIL_ADDRESS" class="form-control" value="">
                </div>
                <div class="mb-4">
                    <label for="PASSWORD" class="form-label">パスワード</label>
                    <input id="PASSWORD" type="password" name="PASSWORD" class="form-control" value="">
                </div>
                <div class="d-grid">
                    <button type="button" class="btn btn-primary" onclick="submitMainForm()">サインイン</button>
                </div>
            </div>
        </div>
    </div>
</div>
