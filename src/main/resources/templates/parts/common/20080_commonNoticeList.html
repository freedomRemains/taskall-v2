<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <!--/* GNR_VAL(通知メッセージ)には<br />を含むため、th:utextでHTMLタグをそのまま出力する */-->
    <div th:fragment="body" class="1000701">
        <div class="p-2">
            <div th:each="notice : ${T(com.freedom.taskall_v2.web.util.HtmlPageItemUtil).findRecords(htmlPage, 'noticeList')}">
                <span th:utext="${notice.GNR_VAL}">notice</span>
            </div>
        </div>
    </div>
</body>
</html>
