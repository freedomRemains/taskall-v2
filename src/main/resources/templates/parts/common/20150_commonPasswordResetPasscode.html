<!--/* メール送信済みの6桁コードを入力させる再設定確認画面。再設定IDがセッションにある間だけ表示する。 */-->
<div xmlns:th="http://www.thymeleaf.org" th:fragment="body" th:if="${PENDING_PASSWORD_RESET_ID != null}" class="1001401 row justify-content-center my-5">
    <div class="col-12 col-md-5 col-lg-4">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h5 card-title text-center mb-4">確認コード入力</h1>
                <p class="text-center mb-4">登録メールアドレス宛にお送りした6桁の番号を入力してください。</p>
                <div class="mb-4">
                    <label for="PASSWORD_RESET_CODE" class="form-label">確認コード</label>
                    <input id="PASSWORD_RESET_CODE" name="PASSWORD_RESET_CODE" class="form-control"
                           inputmode="numeric" maxlength="6" autocomplete="one-time-code">
                </div>
                <div class="d-grid">
                    <button type="button" class="btn btn-primary" onclick="submitMainForm()">送信する</button>
                </div>
            </div>
        </div>
    </div>
</div>
